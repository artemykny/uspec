[package]
name = "uspec"
version = "0.1.0"
edition = "2021"
description = "CLI for uspec: scaffolds, validates and tracks changes to a spec tree"

[[bin]]
name = "uspec"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
